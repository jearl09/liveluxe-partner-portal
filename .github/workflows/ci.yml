# CI pipeline — spec §21.1
# On PR: typecheck → lint → unit + integration → build → (Vercel preview deploys separately) → E2E → secret scan → audit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run guard:service-role
      - run: npm run test:unit -- --coverage
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          HOSTAWAY_ACCOUNT_ID: "0"
          HOSTAWAY_API_KEY: ci
          HOSTAWAY_WEBHOOK_USER: ci-webhook-user-0123456789
          HOSTAWAY_WEBHOOK_PASSWORD: ci-webhook-password-0123456789abcdef
          HOSTAWAY_WEBHOOK_PATH_SECRET: ci-webhook-path-secret-0123456789abcdef
          STRIPE_SECRET_KEY: sk_test_ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          RESEND_API_KEY: re_ci
          EMAIL_FROM: ci@example.com
          EMAIL_REPLY_TO: ci@example.com
          CRON_SECRET: ci-cron-secret-0123456789abcdef0123456789

  integration:
    name: Integration tests (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - run: supabase db reset
      - run: npm run test:integration
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  e2e:
    name: Playwright E2E against preview
    if: github.event_name == 'pull_request'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # TODO(phase-0): resolve the Vercel preview URL for this PR (patrickedqvist/wait-for-vercel-preview) and pass as BASE_URL.
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
